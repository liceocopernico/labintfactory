# Hardware sheet of the LabDaemon photometer (design §7.4). The plugin's code reads these figures.

[[component]]
id = "tsl2591"
role = "Light sensor"
part = "TSL2591"
manufacturer = "ams-OSRAM"
interface = "I²C, address 0x29"
datasheet_url = "https://ams-osram.com/products/sensors/ambient-light-color-spectral-proximity-sensors/ams-tsl2591-light-to-digital-converter"

[component.specs]
channels = [
    { key = "ch0", name = "Full spectrum (visible + infrared)" },
    { key = "ch1", name = "Infrared" },
]
adc_bits = 16
integration_ms = [100, 200, 300, 400, 500, 600]
gains = [1, 25, 428, 9876]            # nominal factors: low, medium, high, max
lux_df = 408.0                         # device factor in the lux formula
lux_formula = "lux = (ch0 - ch1) * (1 - ch1/ch0) / (t * g / 408)"
lux_range = [188e-6, 88000.0]
# Full scale per channel. At 100 ms the ADC tops out lower (value from Adafruit's TSL2591 driver;
# to be confirmed against the ams datasheet).
full_scale_counts = { "100" = 36863, default = 65535 }

[[component]]
id = "led"
role = "Light source"
part = "5 mm LED on the 12-bit DAC (pin A0)"
interface = "DAC, 0-4095"

[component.specs]
colors = ["red", "orange", "green", "blue"]
# Highest drive level per colour, from the photometer's original firmware limits.
max_power = { red = 4000, orange = 850, green = 900, blue = 850 }
# Typical peak wavelengths of such LEDs (nm). Replace with the fitted LEDs' datasheet values.
peak_wavelength_nm = { red = 625, orange = 605, green = 520, blue = 470 }
